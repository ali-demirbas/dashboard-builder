name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests (frontmatter checker, link checker)
        run: python3 -m unittest discover -s tests -v
      - name: Run repo validation
        # Single entry point: frontmatter, internal links, the SKILL.md
        # references table vs. disk, plugin manifest JSON, consolidated-file
        # staleness.
        run: bash scripts/validate.sh

  # A separate job, not another step: a shell defect in the validator must
  # not be reported as (or hidden behind) a content failure, and the two run
  # in parallel rather than gating each other.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
